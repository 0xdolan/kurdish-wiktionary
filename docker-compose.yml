name: wiktionary-to-mdx

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://wiktionary:wiktionary@postgres:5432/wiktionary
  ZIM_PATH: /app/zim/wiktionary/wiktionary_en_all_nopic_2026-06.zim
  ZIM_PATHS: /app/zim/wiktionary/wiktionary_en_all_nopic_2026-06.zim,/app/zim/wiktionary/wiktionary_en_all_maxi_2026-08.zim
  DEFAULT_DATA_SOURCE: sql
  LOG_LEVEL: INFO
  RATE_LIMIT_RPM: "120"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wiktionary
      POSTGRES_PASSWORD: wiktionary
      POSTGRES_DB: wiktionary
    # Host port → 5432 for DBeaver / local uv (override with POSTGRES_HOST_PORT if busy).
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiktionary -d wiktionary"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
    env_file:
      - path: .env
        required: false
    volumes:
      - ./zim:/app/zim:ro
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    profiles:
      - ingest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
    env_file:
      - path: .env
        required: false
    volumes:
      - ./zim:/app/zim:ro
    command:
      - --zim-path
      - /app/zim/wiktionary/wiktionary_ku_all_nopic_2026-06.zim
      - --ingest
      - --max-entries
      - "500"

  catalog:
    build:
      context: .
      dockerfile: docker/catalog.Dockerfile
    profiles:
      - catalog
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
    env_file:
      - path: .env
        required: false
    volumes:
      - ./zim:/app/zim:ro
      - ./build/catalog:/app/build/catalog

volumes:
  postgres_data:
